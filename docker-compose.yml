services:
  postgres:
    image: postgres:17
    container_name: lubrillantas-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: lubrillantas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 183492

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
